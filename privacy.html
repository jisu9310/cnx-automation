<h1>개인정보처리방침</h1>
<p>cnx-automation은 개발자 본인만 사용하는 업무 자동화 도구입니다.</p>
<ul>
<li>Google 계정 데이터(캘린더, 스프레드시트, Analytics)는 본인 PC에서 업무 자동화 목적으로만 사용합니다.</li>
<li>수집한 데이터를 제3자에게 제공하거나 판매하지 않습니다.</li>
<li>인증 토큰은 본인 PC에만 저장합니다.</li>
</ul>
<p>문의: 저장소 이슈로 남겨 주세요.</p>
